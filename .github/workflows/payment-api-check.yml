name: Forsa Payment API check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find payment-api -type f -name "*.js" -print0)
