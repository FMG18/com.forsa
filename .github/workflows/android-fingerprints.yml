name: Forsa Android fingerprints

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate temporary debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print SHA-1 and SHA-256
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'Owner:|SHA1:|SHA256:'

      - name: Upload keystore fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: forsa-android-fingerprints
          path: "$HOME/.android/debug.keystore"
