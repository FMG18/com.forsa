name: Forsa Android fingerprints

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate temporary debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Extract fingerprints
        id: fingerprints
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey > fingerprint.txt

          SHA1=$(grep -m1 'SHA1:' fingerprint.txt | sed 's/.*SHA1: //')
          SHA256=$(grep -m1 'SHA256:' fingerprint.txt | sed 's/.*SHA256: //')

          echo "SHA1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "SHA256=$SHA256" >> "$GITHUB_OUTPUT"

          {
            echo '## Forsa Android fingerprints'
            echo
            echo "**SHA-1:** \`$SHA1\`"
            echo
            echo "**SHA-256:** \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

          cat fingerprint.txt | grep -E 'Owner:|SHA1:|SHA256:'

      - name: Upload fingerprint report
        uses: actions/upload-artifact@v4
        with:
          name: forsa-android-fingerprints
          path: fingerprint.txt
