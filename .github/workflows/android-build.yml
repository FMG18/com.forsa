name: Forsa Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "ci/build-status.txt"

permissions:
  contents: write

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ci/build.log
          code=\${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit "$code"

      - name: Runtime smoke test on Android Emulator
        id: smoke
        if: env.BUILD_EXIT_CODE == '0'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          ram-size: 2048M
          disk-size: 8G
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -o pipefail
            mkdir -p ci
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.forsa.app
            adb shell am start -W -n com.forsa.app/.MainActivity
            sleep 8
            pid=\$(adb shell pidof com.forsa.app | tr -d '\\r' || true)
            if [ -z "$pid" ]; then
              echo "Application process is not running."
              adb logcat -d -t 400 > ci/smoke-logcat.txt
              exit 1
            fi
            adb logcat -d -t 400 > ci/smoke-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com\\.forsa\\.app, PID:|AndroidRuntime: FATAL EXCEPTION" ci/smoke-logcat.txt; then
              echo "Runtime crash detected."
              exit 1
            fi
            echo "Runtime smoke test passed."

      - name: Collect build and smoke status
        if: always()
        shell: bash
        run: |
          mkdir -p ci
          build_code="\${BUILD_EXIT_CODE:-1}"
          smoke_ok="\${{ steps.smoke.outcome == 'success' }}"
          if [ "$build_code" = "0" ] && [ "$smoke_ok" = "true" ]; then
            status="PASS"
            summary="APK built successfully and launched on Android Emulator without a detected crash."
            smoke_code=0
          elif [ "$build_code" != "0" ]; then
            status="FAIL"
            summary="APK build failed with exit code $build_code."
            smoke_code=1
          else
            status="FAIL"
            summary="APK built, but runtime smoke test failed."
            smoke_code=1
          fi
          {
            echo "status=$status"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
            echo "attempt=$GITHUB_RUN_ATTEMPT"
            echo "build_exit_code=$build_code"
            echo "smoke_exit_code=$smoke_code"
            echo "smoke_outcome=$smoke_ok"
            echo "summary=$summary"
            echo
            echo "--- build log tail ---"
            tail -n 80 ci/build.log 2>/dev/null || true
            echo
            echo "--- smoke logcat tail ---"
            tail -n 120 ci/smoke-logcat.txt 2>/dev/null || true
          } > ci/build-status.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forsa-android-build-\${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ci/build.log
            ci/smoke-logcat.txt
            ci/build-status.txt
          if-no-files-found: warn

      - name: Commit build status
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/build-status.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: record Android build status [skip ci]"
          git push

      - name: Fail workflow when verification failed
        if: always()
        shell: bash
        run: |
          build_code="\${BUILD_EXIT_CODE:-1}"
          smoke_outcome="\${{ steps.smoke.outcome }}"
          if [ "$build_code" != "0" ] || [ "$smoke_outcome" != "success" ]; then
            exit 1
          fi
